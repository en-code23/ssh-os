[package]
name = "ssh-os"
version = "2.1.1"
description = "A macOS-style desktop for your servers"
edition = "2021"
license = "MIT"

[lib]
name = "ssh_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
futures = "0.3.34"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
russh = "0.65.1"
russh-sftp = "3.0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
suppaftp = { version = "12.2.1", features = ["tokio", "tokio-rustls-ring"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
uuid = { version = "1.29.2", features = ["v4"] }
webpki-roots = "1.0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
