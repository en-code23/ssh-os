appId: com.sshos.app
productName: SSH OS
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # optional native speed-up for ssh2; not needed and adds a native module
  - "!node_modules/{cpu-features,nan,buildcheck}/**"
# Size: ship only English Chromium locales and use the strongest compression
electronLanguages: [en, en-US, en-GB]
compression: maximum
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: SSH-OS-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    # used by the in-app updater
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: false
  identity: "-"
dmg:
  title: SSH OS
  format: UDBZ
win:
  icon: build/icon.png
  artifactName: SSH-OS-Setup-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SSH OS
publish:
  provider: github
  owner: en-code23
  repo: ssh-os
  releaseType: release
